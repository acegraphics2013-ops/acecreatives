<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-kpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="50%" stop-color="#121620" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-kpi)" />
  
  <!-- Grid Lines -->
  <line x1="60" y1="100" x2="1140" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="60" y1="580" x2="1140" y2="580" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Crop marks -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#ee5c21" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 1170 50 L 1170 30 L 1150 30" stroke="#ee5c21" stroke-width="2" fill="none" opacity="0.6"/>
  
  <text x="60" y="65" font-family="Courier, monospace" font-size="14" fill="#ee5c21" letter-spacing="3">SYSTEM // KPI MONITORING &amp; DPMS PLATFORM [02]</text>
  <text x="1140" y="65" font-family="Courier, monospace" font-size="14" fill="#888880" text-anchor="end">NODE.JS + EXPRESS + MYSQL</text>

  <!-- Metric Cards -->
  <rect x="60" y="120" width="250" height="110" rx="6" fill="#181d28" stroke="rgba(238, 92, 33, 0.3)" stroke-width="1.5" />
  <text x="80" y="150" font-family="Courier, monospace" font-size="11" fill="#8899b0">TOTAL TARGET ACCOMPLISHMENT</text>
  <text x="80" y="195" font-family="Space Grotesk, sans-serif" font-size="38" font-weight="bold" fill="#ee5c21">94.8%</text>
  
  <rect x="335" y="120" width="250" height="110" rx="6" fill="#181d28" stroke="rgba(255,255,255,0.08)" />
  <text x="355" y="150" font-family="Courier, monospace" font-size="11" fill="#8899b0">REPORTING UNITS</text>
  <text x="355" y="195" font-family="Space Grotesk, sans-serif" font-size="38" font-weight="bold" fill="#ffffff">36 / 36</text>
  
  <rect x="610" y="120" width="250" height="110" rx="6" fill="#181d28" stroke="rgba(255,255,255,0.08)" />
  <text x="630" y="150" font-family="Courier, monospace" font-size="11" fill="#8899b0">AUDIT TRAIL LOGS</text>
  <text x="630" y="195" font-family="Space Grotesk, sans-serif" font-size="38" font-weight="bold" fill="#ffffff">1,420</text>
  
  <rect x="885" y="120" width="255" height="110" rx="6" fill="#181d28" stroke="rgba(255,255,255,0.08)" />
  <text x="905" y="150" font-family="Courier, monospace" font-size="11" fill="#8899b0">RBAC ACCESS LEVEL</text>
  <text x="905" y="195" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="bold" fill="#ee5c21">ADMIN / EXEC</text>

  <!-- Big Graph Representation -->
  <rect x="60" y="255" width="1080" height="300" rx="6" fill="#131722" stroke="rgba(255,255,255,0.05)" />
  <!-- Grid in chart -->
  <line x1="100" y1="310" x2="1100" y2="310" stroke="rgba(255,255,255,0.05)" />
  <line x1="100" y1="370" x2="1100" y2="370" stroke="rgba(255,255,255,0.05)" />
  <line x1="100" y1="430" x2="1100" y2="430" stroke="rgba(255,255,255,0.05)" />
  <line x1="100" y1="490" x2="1100" y2="490" stroke="rgba(255,255,255,0.05)" />

  <!-- Graph Polyline -->
  <path d="M 120 480 Q 250 420 380 340 T 640 290 T 900 320 T 1080 270" fill="none" stroke="#ee5c21" stroke-width="4" />
  <path d="M 120 480 Q 250 420 380 340 T 640 290 T 900 320 T 1080 270 L 1080 510 L 120 510 Z" fill="rgba(238, 92, 33, 0.08)" />
  
  <text x="60" y="640" font-family="Space Grotesk, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">PHU KPI-DPMS — Performance Management System</text>
</svg>
