<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pharm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1412" />
      <stop offset="100%" stop-color="#060c0a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-pharm)" />
  
  <text x="60" y="65" font-family="Courier, monospace" font-size="14" fill="#00ffb4" letter-spacing="3">HEALTHCARE // PHARMACY MANAGEMENT &amp; POS [05]</text>
  <text x="1140" y="65" font-family="Courier, monospace" font-size="14" fill="#888880" text-anchor="end">INVENTORY + BATCH + EXPIRY LOGS</text>

  <rect x="60" y="100" width="1080" height="470" rx="8" fill="#111c19" stroke="rgba(0,255,180,0.2)" stroke-width="1.5" />

  <rect x="90" y="130" width="680" height="410" rx="6" fill="#0b1311" />
  <text x="110" y="165" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Medicine Inventory &amp; Expiry Monitoring</text>
  
  <rect x="110" y="185" width="640" height="35" fill="#182723" />
  <text x="125" y="208" font-family="Courier, monospace" font-size="11" fill="#00ffb4">ITEM CODE | DRUG NAME | BATCH NO. | STOCK | EXPIRY DATE | STATUS</text>

  <text x="125" y="245" font-family="sans-serif" font-size="12" fill="#ffffff">MED-0012 · Amoxicillin 500mg · B2025-09 · 1,450 pcs · 2027-11-30 · OK</text>
  <text x="125" y="280" font-family="sans-serif" font-size="12" fill="#ff5f56">MED-0044 · Paracetamol 500mg · B2024-03 · 80 pcs · 2026-10-15 · NEAR EXPIRY</text>
  <text x="125" y="315" font-family="sans-serif" font-size="12" fill="#ffffff">MED-0108 · Maintenance Kit B · B2025-12 · 620 pcs · 2028-04-30 · OK</text>

  <!-- POS Cart Panel -->
  <rect x="790" y="130" width="320" height="410" rx="6" fill="#152420" stroke="rgba(0,255,180,0.3)" />
  <text x="810" y="165" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">POS Terminal #01</text>
  <line x1="810" y1="180" x2="1090" y2="180" stroke="rgba(255,255,255,0.1)" />
  <text x="810" y="210" font-family="sans-serif" font-size="13" fill="#ffffff">Rx #99104 - Outpatient</text>
  <text x="810" y="240" font-family="Courier, monospace" font-size="12" fill="#88a098">Amoxicillin x 21 caps</text>
  <text x="810" y="265" font-family="Courier, monospace" font-size="12" fill="#88a098">Vitamin C x 30 tabs</text>
  
  <rect x="810" y="340" width="280" height="50" rx="4" fill="#00ffb4" />
  <text x="950" y="370" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">COMPLETE TRANSACTION</text>

  <text x="60" y="640" font-family="Space Grotesk, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Pharmacy Management System</text>
