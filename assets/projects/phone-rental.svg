      <stop offset="0%" stop-color="#14110c" />
      <stop offset="100%" stop-color="#0a0806" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-device)" />
  
  <text x="60" y="65" font-family="Courier, monospace" font-size="14" fill="#ffb703" letter-spacing="3">PLATFORM // DEVICE MANAGEMENT &amp; RENTAL SYSTEM [04]</text>
