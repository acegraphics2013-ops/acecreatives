  <text x="390" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Google Sheets Sync &amp; Real-time Rental Log</text>
  
  <rect x="390" y="205" width="680" height="40" fill="#251f18" />
