  <rect x="60" y="100" width="1080" height="470" rx="8" fill="#1b1712" stroke="rgba(255,183,3,0.2)" stroke-width="1.5" />

  <!-- Device Grid -->
  <rect x="100" y="140" width="220" height="390" rx="12" fill="#0f0d0a" stroke="rgba(255,183,3,0.4)" stroke-width="2" />
  <rect x="120" y="160" width="180" height="300" rx="6" fill="#1a1610" />
  <circle cx="210" cy="485" r="10" fill="none" stroke="#ffb703" stroke-width="2" />
  <text x="210" y="240" font-family="Courier, monospace" font-size="28" font-weight="bold" fill="#ffb703" text-anchor="middle">TAB-01</text>
