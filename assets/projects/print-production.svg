<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-print" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#1f1a14" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-print)" />
  
  <!-- Registration Marks -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="#ee5c21" stroke-width="1.5" />
  <line x1="50" y1="30" x2="50" y2="70" stroke="#ee5c21" stroke-width="1.5" />
  <line x1="30" y1="50" x2="70" y2="50" stroke="#ee5c21" stroke-width="1.5" />
  
  <circle cx="1150" cy="50" r="14" fill="none" stroke="#ee5c21" stroke-width="1.5" />
  <line x1="1150" y1="30" x2="1150" y2="70" stroke="#ee5c21" stroke-width="1.5" />
  <line x1="1130" y1="50" x2="1170" y2="50" stroke="#ee5c21" stroke-width="1.5" />

  <text x="100" y="55" font-family="Courier, monospace" font-size="14" fill="#ee5c21" letter-spacing="3">PRINT PRODUCTION // PHYSICAL OUTPUT // PREPRESS [07]</text>

  <!-- CMYK Swatches Bar -->
  <rect x="950" y="40" width="30" height="20" fill="#00ffff" />
  <rect x="980" y="40" width="30" height="20" fill="#ff00ff" />
  <rect x="1010" y="40" width="30" height="20" fill="#ffff00" />
  <rect x="1040" y="40" width="30" height="20" fill="#000000" stroke="#ffffff" stroke-width="1" />

  <!-- Big Horizontal Layout -->
  <text x="60" y="210" font-family="Space Grotesk, sans-serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="-5">BEYOND THE SCREEN</text>

  <rect x="60" y="260" width="1080" height="300" rx="8" fill="#181816" stroke="rgba(238, 92, 33, 0.2)" stroke-width="1.5" />

  <g transform="translate(90, 290)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="310" height="240" rx="6" fill="#0d0d0c" stroke="rgba(255,255,255,0.08)" />
    <text x="20" y="35" font-family="Courier, monospace" font-size="13" fill="#ee5c21">LARGE FORMAT</text>
    <text x="20" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Tarpaulins &amp; Backdrops</text>
    <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#888880">High-resolution banner printing, eyelets, hem finishing, and event backdrop installation.</text>
    <rect x="20" y="170" width="140" height="28" rx="3" fill="rgba(238, 92, 33, 0.18)" stroke="#ee5c21" />
    <text x="90" y="189" font-family="Courier, monospace" font-size="11" fill="#ee5c21" text-anchor="middle">300 DPI PREPRESS</text>

    <!-- Card 2 -->
    <rect x="340" y="0" width="310" height="240" rx="6" fill="#0d0d0c" stroke="rgba(255,255,255,0.08)" />
    <text x="360" y="35" font-family="Courier, monospace" font-size="13" fill="#ee5c21">APPAREL &amp; DTF</text>
    <text x="360" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">DTF &amp; Sublimation</text>
    <text x="360" y="95" font-family="sans-serif" font-size="12" fill="#888880">Direct-to-Film transfer, heat press calibration, full sublimation polo shirts, and merchandise.</text>
    <rect x="360" y="170" width="140" height="28" rx="3" fill="rgba(238, 92, 33, 0.18)" stroke="#ee5c21" />
    <text x="430" y="189" font-family="Courier, monospace" font-size="11" fill="#ee5c21" text-anchor="middle">HEAT PRESS TEMP 165°C</text>

    <!-- Card 3 -->
    <rect x="680" y="0" width="320" height="240" rx="6" fill="#0d0d0c" stroke="rgba(255,255,255,0.08)" />
    <text x="700" y="35" font-family="Courier, monospace" font-size="13" fill="#ee5c21">SIGNAGE &amp; EVENT</text>
    <text x="700" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Stickers &amp; Booth Materials</text>
    <text x="700" y="95" font-family="sans-serif" font-size="12" fill="#888880">Vinyl contour cutting, die-cut stickers, acrylic signages, booth graphics, and display panels.</text>
    <rect x="700" y="170" width="150" height="28" rx="3" fill="rgba(238, 92, 33, 0.18)" stroke="#ee5c21" />
    <text x="775" y="189" font-family="Courier, monospace" font-size="11" fill="#ee5c21" text-anchor="middle">CONTOUR CUTTING</text>
  </g>

  <text x="60" y="640" font-family="Space Grotesk, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Print &amp; Event Production Capabilities</text>
</svg>
